name: Build HOTEL GMAO PRO APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project files if zipped
        run: |
          if [ ! -f "gradlew" ] && ls *.zip 1> /dev/null 2>&1; then
            unzip -n *.zip
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOTEL-GMAO-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
